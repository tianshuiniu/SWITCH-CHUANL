name: Build Switch NRO (云上自动编译)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:name: Build Switch NRO (自带全部源码)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: 生成全部源码并编译
        run: |
            set -e
            pacman-key --init 2>/dev/null || true
            pacman-key --populate devkitpro 2>/dev/null || true
            dkp-pacman -Syy --noconfirm 2>/dev/null || pacman -Syy --noconfirm 2>/dev/null || true
            for pkg in switch-dev switch-curl switch-mbedtls; do echo ">>> 安装 $pkg"; if dkp-pacman -S --noconfirm --needed "$pkg" 2>/dev/null || pacman -S --noconfirm --needed "$pkg" 2>/dev/null; then echo "    OK $pkg"; else echo "    WARN $pkg 安装失败（继续）"; fi; done
            mkdir -p include/xcloud
            cat > include/xcloud/config.h <<'XBEOF'
            #pragma once
            #include <string>
            #include <vector>
            #include <map>
            
            // 独立实现的 xCloud (Xbox Cloud Gaming) 串流客户端 —— 鉴权 + REST 接口层
            // 仅用于研究 / 教育 / 互操作性，使用你自己的微软账号。
            // 所有端点均来自对 xgo.nro 的静态分析核实，属公开 xCloud 协议。
            
            namespace xcloud {
            
            // 公开的个人客户端 ID（xCloud 网页版使用的同一个），非秘密封钥
            constexpr const char* kClientId = "000000004c20a908";
            constexpr const char* kScope    = "service::user.auth.xboxlive.com::MBI_SSL";
            constexpr const char* kUserAgent = "xcloud-switch/0.1 (research)";
            
            // ---- 微软 / Xbox Live 端点 ----
            constexpr const char* kMsDeviceCodeUrl   = "https://login.microsoftonline.com/consumers/oauth2/v2.0/devicecode";
            constexpr const char* kMsTokenUrl        = "https://login.microsoftonline.com/consumers/oauth2/v2.0/token";
            constexpr const char* kXblUserAuthUrl    = "https://user.auth.xboxlive.com/user/authenticate";
            constexpr const char* kXstsAuthUrl       = "https://xsts.auth.xboxlive.com/xsts/authorize";
            constexpr const char* kXcloudLoginUrl    = "https://xhome.gssv-play-prod.xboxlive.com/v2/login/user";
            
            // ---- 区域边缘节点（来自 xgo config.json 的 region_ips）----
            struct Region {
                std::string name;   // EASTUS 等
                std::string label;  // 中文显示名
                std::string ip;     // WebRTC 媒体边缘 IP
                std::string lang;   // 默认语言
            };
            inline const std::vector<Region> kRegions = {
                {"EASTUS",         "美国东部",   "203.41.44.20", "en"},
                {"WESTUS",         "美国西部",   "68.224.57.1",  "en"},
                {"WESTEUROPE",     "西欧",       "52.165.177.1", "en"},
                {"JAPANEAST",      "日本东部",   "20.43.132.1",  "ja"},
                {"KOREACENTRAL",   "韩国中部",   "20.200.225.1", "ko"},
                {"SOUTHEASTASIA",  "东南亚",     "20.73.130.1",  "en"},
                {"AUSTRALIAEAST",  "澳大利亚东部","20.195.85.1",  "zh"},
            };
            
            // ---- WebRTC 连接辅助（来自 config.json）----
            inline const std::vector<std::string> kStunServers = {
                "stun:stun.miwifi.com:3478",
                "stun:stun.chat.bilibili.com:3478",
            };
            inline const std::vector<std::string> kDohServers = {
                "https://dns.alidns.com/resolve",
                "https://1.12.12.12/dns-query",
                "https://8.8.8.8/resolve",
            };
            inline const std::vector<int> kTeredoPorts = {9002};
            
            } // namespace xcloud
            
            XBEOF
            mkdir -p include/xcloud
            cat > include/xcloud/types.h <<'XBEOF'
            #pragma once
            #include <string>
            
            namespace xcloud {
            
            // 微软账号 OAuth2 令牌（device-code 流程）
            struct MsaTokens {
                std::string accessToken;
                std::string refreshToken;
                long expiresIn = 0;
                std::string tokenType = "Bearer";
            };
            
            // Xbox Live 用户令牌（user.auth.xboxlive.com）
            struct XboxUserAuth {
                std::string token;  // "u=..."
                std::string uhs;    // user hash，需与 XSTS 的 uhs 一致
            };
            
            // Xbox Live XSTS 令牌（xsts.auth.xboxlive.com，relying party = gssv）
            struct XboxXsts {
                std::string token;  // "t=..."
                std::string uhs;
                std::string gti;    // 来自 DisplayClaims，GSSV 登录需用
                std::string gsp;    // 来自 DisplayClaims
                std::string gamertag;
            };
            
            // xCloud (GSSV) 登录会话
            struct CloudSession {
                std::string serverId;
                std::string gsToken;
                std::string baseUri;     // 形如 https://<region>.gssv-play-prod.xboxlive.com
                std::string expiresAt;
                std::string xstsToken;   // 原始 XSTS，WebRTC 连接时仍要用
                std::string gamertag;
            };
            
            } // namespace xcloud
            
            XBEOF
            mkdir -p include/xcloud
            cat > include/xcloud/http_client.h <<'XBEOF'
            #pragma once
            #include <string>
            #include <map>
            
            namespace xcloud {
            
            struct HttpResponse {
                long status = 0;       // HTTP 状态码，0 表示请求层失败
                std::string body;
                std::string error;     // 非空表示 libcurl / 传输层错误
            };
            
            // 极简同步 HTTP 客户端（libcurl 封装）。
            // Switch 端可替换为 libnx 的 HTTP 后端，接口不变。
            class HttpClient {
            public:
                HttpClient();
                ~HttpClient();
            
                void setUserAgent(const std::string& ua);
                void setTimeoutSec(int sec);
            
                HttpResponse get(const std::string& url,
                                 const std::map<std::string, std::string>& headers = {});
                HttpResponse post(const std::string& url,
                                 const std::string& body,
                                 const std::string& contentType = "application/json",
                                 const std::map<std::string, std::string>& headers = {});
            
            private:
                HttpResponse request(const std::string& method, const std::string& url,
                                     const std::string& body, const std::string& ctype,
                                     const std::map<std::string, std::string>& headers);
                std::string userAgent_ = "xcloud-switch/0.1";
                int timeoutSec_ = 30;
            };
            
            } // namespace xcloud
            
            XBEOF
            mkdir -p include/xcloud
            cat > include/xcloud/auth.h <<'XBEOF'
            #pragma once
            #include "xcloud/types.h"
            #include <string>
            
            namespace xcloud {
            
            // 鉴权流程封装：
            //   MSA(device-code) -> Xbox User Auth -> XSTS(gssv) -> xCloud(GSSV) 登录
            // 返回 CloudSession 供后续串流信令使用。
            class Auth {
            public:
                // 走 device-code 流程，过程中会在控制台打印用户码与验证链接，并轮询直至用户登录。
                // 返回 MSA 访问/刷新令牌。
                static MsaTokens loginMsa();
            
                // user.auth.xboxlive.com：用 MSA 访问令牌换用户令牌（RPS ticket）。
                static XboxUserAuth authorizeUser(const std::string& msaAccessToken);
            
                // xsts.auth.xboxlive.com：用用户令牌换 XSTS（relying party = gssv）。
                static XboxXsts authorizeXsts(const std::string& userToken);
            
                // xhome.gssv-play-prod.xboxlive.com/v2/login/user：用 XSTS 登录 xCloud。
                static CloudSession loginCloud(const XboxXsts& xsts, const std::string& gamertag);
            
                // 一站式：device-code 登录并拿到 CloudSession。
                static CloudSession fullLogin();
            };
            
            // 工具：把字符串做 application/x-www-form-urlencoded 编码（用于表单体）。
            std::string urlEncode(const std::string& in);
            
            } // namespace xcloud
            
            XBEOF
            mkdir -p include/xcloud
            cat > include/xcloud/stream.h <<'XBEOF'
            #pragma once
            #include "xcloud/types.h"
            #include "xcloud/config.h"
            #include <nlohmann/json.hpp>
            #include <string>
            
            namespace xcloud {
            
            // xCloud 串流信令 / 配置接口层（WebRTC 媒体传输为第二阶段，此处只做 REST 与会话构造）
            class Stream {
            public:
                // 拉取串流会话配置（分辨率档位、输入能力、特性开关等）
                static nlohmann::json getConfiguration(const CloudSession& s);
            
                // 选择一个区域（返回引用；不拷贝）
                static const Region& pickRegion(const std::string& name);
            
                // 默认区域（东南亚/澳大利亚对中文用户友好，按需要改）
                static const Region& defaultRegion();
            
                // 构造一个 WebRTC SDP offer 模板（H.265 视频 + Opus 音频 + transport-cc）。
                // 注意：真正的 offer 应由 WebRTC 栈（如 libdatachannel）在连接时生成，
                // 这里仅提供符合 xCloud 协商格式的参考模板，供第二阶段对接与联调。
                static std::string buildSdpOfferTemplate(const std::string& ufrag,
                                                         const std::string& pwd,
                                                         const std::string& fingerprint);
            };
            
            } // namespace xcloud
            
            XBEOF
            mkdir -p third_party/nlohmann
            DL="https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp"; if command -v curl >/dev/null 2>&1; then curl -fsSL -o third_party/nlohmann/json.hpp "$DL"; elif command -v wget >/dev/null 2>&1; then wget -q -O third_party/nlohmann/json.hpp "$DL"; else python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$DL" third_party/nlohmann/json.hpp; fi
            ls -l third_party/nlohmann/json.hpp
            echo "" | base64 -d > icon.jpg
            echo "=== 文件检查 ==="
            ls -la include/xcloud src third_party/nlohmann icon.jpg
            export DEVKITPRO=/opt/devkitpro
            make
            ls -la xcloud_switch.nro
      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: xcloud_switch.nro
          path: xcloud_switch.nro

    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备包管理器
        run: |
          pacman-key --init 2>/dev/null || true
          pacman-key --populate devkitpro 2>/dev/null || true
          dkp-pacman -Syy --noconfirm 2>/dev/null || pacman -Syy --noconfirm 2>/dev/null || true

      - name: 安装 Switch 需要的库
        run: |
          for pkg in switch-dev switch-curl switch-mbedtls; do
            echo ">>> 正在安装 $pkg ..."
            if dkp-pacman -S --noconfirm --needed "$pkg" 2>/dev/null || pacman -S --noconfirm --needed "$pkg" 2>/dev/null; then
              echo "    OK $pkg"
            else
              echo "    WARN $pkg 安装失败（先继续）"
            fi
          done

      - name: 检查工具链
        run: |
          export DEVKITPRO=/opt/devkitpro
          echo "gcc: $(which aarch64-none-elf-gcc 2>/dev/null || echo MISSING)"
          echo "nx-makenro: $(which nx-makenro 2>/dev/null || echo MISSING)"
          echo "switch_rules: $(ls $DEVKITPRO/libnx/switch_rules 2>/dev/null || echo MISSING)"

      - name: 编译出 .nro
        run: |
          export DEVKITPRO=/opt/devkitpro
          make
          ls -la xcloud_switch.nro

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: xcloud_switch.nro
          path: xcloud_switch.nro
