name: Build Switch NRO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Switch 需要的库
        run: |
          dkp-pacman -S --noconfirm switch-dev switch-curl switch-mbedtls

      - name: 编译出 .nro
        run: |
          export DEVKITPRO=/opt/devkitpro
          make

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: xcloud_switch.nro
          path: xcloud_switch.nro
